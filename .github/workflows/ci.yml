name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 静态检查与单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 安装检查工具
        run: pip install -r requirements-dev.txt

      - name: 语法编译检查
        run: python -m compileall -q engine launcher.py migrate_update.py sdk tests

      - name: Ruff 检查
        run: ruff check .

      # 这些用例使用虚构会话与模拟服务，不发起网络请求，也不需要微信或本地模型
      - name: 离线单元测试
        run: python -m unittest discover -s tests -p "test_*.py" -v

  panel:
    name: 面板排版与交互检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium

      - name: 排版检查
        run: npm run test:layout

      - name: 交互检查
        run: npm run test:actions
