name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 静态检查与单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 安装检查工具
        run: pip install -r requirements-dev.txt

      # 依赖清单里有 Requires-Python <3.13 的包（rapidocr-onnxruntime==1.4.4），
      # 一旦 python 变成 3.13，pip-audit / pip install 都会在解析阶段失败，
      # 而报错信息是「找不到满足条件的版本」，很容易被误读成「包没了」。
      # 这里显式断言，把这个隐式前提变成会说话的检查。
      - name: 断言 Python 版本
        run: |
          python - <<'PY'
          import sys
          assert sys.version_info[:2] == (3, 12), (
              f"需要 Python 3.12（rapidocr-onnxruntime 1.4.4 不支持 3.13），"
              f"当前为 {sys.version.split()[0]}"
          )
          print("Python", sys.version.split()[0], "OK")
          PY

      - name: 语法编译检查
        run: python -m compileall -q engine launcher.py migrate_update.py sdk tests

      - name: Ruff 检查
        run: ruff check .

      # 与本地 .pre-commit-config.yaml 跑同一套文件卫生检查（单一事实来源）。
      # CI 才是最终裁决者：本地钩子可以 --no-verify 绕过，这里绕不过去。
      #
      # 用 `pre-commit run --all-files` 复现本地策略，而不是把每条检查抄一遍 ——
      # 抄一遍迟早会和本地配置漂移。--show-diff-on-failure 让失败时能看到漏改。
      #
      # 注意：本地因 Application Control 策略禁用了 check-case-conflict 与
      # mixed-line-ending，这里也保持一致（两者在 runner 上可跑，但「本地能过、
      # CI 挂掉」比「两边都查同一组规则」更难排查，所以宁可两边同策略）。
      - name: 文件卫生检查（与本地 pre-commit 同策略）
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

      # 供应链安全：检查依赖清单里有没有已知漏洞（CVE/GHSA）。
      #
      # 用官方 pypa/gh-action-pip-audit 而不是手写 pip install pip-audit：
      # 它会渲染 GitHub job summary，且失败时行为一致。
      # 版本固定到 v1.1.0 —— 与本仓库其他 action 一样，不跟 main 漂。
      #
      # 扫的是 requirements*.txt 而不是当前环境：这里只装了 dev 依赖，
      # 「pip list」模式会漏掉运行时的 numpy/opencv/onnxruntime 等。
      #
      # 关键点（踩过的坑）：该 action **没有** python-version 输入（已核对
      # action.yml），它用 PATH 上第一个 python，或 inputs.virtual-environment
      # 指定的虚拟环境。而 rapidocr-onnxruntime==1.4.4 声明
      # Requires-Python >=3.6,<3.13，在 3.13 下 pip 解析 requirements.txt
      # 会直接失败（Could not find a version that satisfies the requirement）。
      #
      # 本 step 位于上面 setup-python(3.12) 之后，PATH 上的 python 已经是
      # 3.12，因此**不要**把这一步挪到 setup-python 之前，那样会被 runner
      # 自带的 3.13 接住并静默失败。为防日后调整顺序时踩坑，这里显式断言。
      - name: 依赖漏洞扫描
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.txt requirements-dev.txt
          vulnerability-service: osv

      # 安全规则族（S，等价于 Bandit）已并入上面的 ruff check —— pyproject 的
      # lint.select 里有 "S"，lint.ignore 里有逐条复核过的豁免理由（S603/S606/
      # S310/S110/S112 是实测误报，S101 全在 selftest 里）。
      #
      # 这里额外跑一次**不带 pyproject 豁免**的原始扫描，只做情报展示、不判失败：
      # 想看全貌时有用，也方便日后有人质疑「豁免是不是盖住了真问题」时对照。
      # 注意别把这一步改成会失败的检查 —— 原始命中里 78 条全是已复核的误报。
      - name: 安全规则情报（不判失败，仅记录）
        run: ruff check --isolated --select S --statistics . || true

      # 这些用例使用虚构会话、合成画布与模拟服务，不发起网络请求，
      # 也不需要微信、真实截图或本地模型。tests/test_ocr_replay.py 会替换
      # 掉 OCR 引擎、只跑下游归属/合并/去重逻辑，因此不需要 OCR 模型权重。
      #
      # 同时确认没有用例被跳过：若因 Python 版本漂移导致 OCR 依赖装不上，
      # 测试模块会整体 skip，套件仍是绿的但覆盖悄悄消失。
      - name: 离线单元测试
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v 2>&1 | tee /tmp/test.log
          if grep -qE "skipped=" /tmp/test.log; then
            echo "::error::有用例被跳过，请检查依赖是否安装完整"
            exit 1
          fi

  panel:
    name: 面板排版与交互检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium

      - name: 排版检查
        run: npm run test:layout

      - name: 交互检查
        run: npm run test:actions
